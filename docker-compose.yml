networks:
  als-mojaloop-net:
    name: als-mojaloop-net

# Redis node definition
x-redis-node: &REDIS_NODE
  platform: linux/amd64
  image: docker.io/bitnami/redis-cluster:6.2.14
  environment: &REDIS_ENVS
    ALLOW_EMPTY_PASSWORD: "yes"
    # Enable auto-discovery of other nodes
    REDIS_CLUSTER_DYNAMIC_IPS: "yes"
    # Redis cluster peers (internal hostnames, default port 6379)
    REDIS_NODES: redis-node-0:6379 redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379 redis-node-5:6379
    # Each node will announce this port (6379)
    REDIS_CLUSTER_ANNOUNCE_PORT: "6379"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    timeout: 2s
  networks:
    - als-mojaloop-net

# Shared account-lookup-service config
x-account-lookup-service: &ACCOUNT_LOOKUP_SERVICE
  platform: linux/amd64
  image: mojaloop/account-lookup-service:local
  build:
    context: .
    target: builder
  user: root
  environment:
    LOG_LEVEL: debug
  networks:
    - als-mojaloop-net
  depends_on:
    mysql-als:
      condition: service_healthy
    central-ledger:
      condition: service_healthy
    redis-node-0:
      condition: service_healthy
  volumes:
    - ./secrets:/opt/app/secrets
    - ./src:/opt/app/src
    - ./docker/account-lookup-service/default.json:/opt/app/config/default.json
    - ./docker/wait-for:/opt/wait-for
  extra_hosts:
    - "redis-node-0:host-gateway"

services:
  account-lookup-service:
    <<: *ACCOUNT_LOOKUP_SERVICE
    container_name: als_account-lookup-service
    command: ["sh", "-c", "npm run start:apiAndAdmin"]
    ports:
      - "4001:4001"
      - "4002:4002"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "apk --no-cache add curl; curl http://localhost:4001/health",
        ]
      timeout: 20s
      retries: 10
      interval: 30s

  account-lookup-service-handlers:
    <<: *ACCOUNT_LOOKUP_SERVICE
    container_name: als_account-lookup-service-handlers
    command: ["sh", "-c", "node src/handlers/index.js h --timeout"]
    depends_on:
      account-lookup-service:
        condition: service_healthy
    ports:
      - "4003:4003"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "apk --no-cache add curl; curl http://localhost:4003/health",
        ]
      timeout: 20s
      retries: 10
      interval: 30s

  central-ledger:
    platform: linux/amd64
    image: mojaloop/central-ledger:v17.8.0-snapshot.34
    container_name: als_central-ledger
    user: root
    command:
      [
        "sh",
        "-c",
        "sh /opt/wait-for/wait-for-central-ledger.sh && node src/api/index.js",
      ]
    ports:
      - "${CL_PORT:-3001}:3001"
    volumes:
      - ./docker/central-ledger/default.json:/opt/app/config/default.json
      - ./docker/wait-for:/opt/wait-for
    environment:
      - LOG_LEVEL=debug
      - CLEDG_DATABASE_URI=mysql://central_ledger:password@mysql-cl:3306/central_ledger
      - CLEDG_SIDECAR__DISABLED=true
      - CLEDG_MONGODB__DISABLED=true
    networks:
      - als-mojaloop-net
    depends_on:
      mysql-cl:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-node-0:
        condition: service_healthy
    extra_hosts:
      - "redis-node-0:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "apk --no-cache add curl; curl http://localhost:3001/health",
        ]
      timeout: 20s
      retries: 10
      interval: 30s

  proxy:
    build:
      context: ./docker/mock-proxy
      dockerfile: Dockerfile
    restart: always
    env_file: ./test/integration/.env
    ports:
      - "${PROXY_PORT}:${PROXY_PORT}"
    networks:
      - als-mojaloop-net

  kafka:
    platform: linux/amd64
    image: johnnypark/kafka-zookeeper:2.3.0
    container_name: als_kafka
    volumes:
      - ./docker/kafka/:/opt/kafka_2.12-2.3.0/config/
    ports:
      - "2181:2181"
      - "9092:9092"
    environment:
      - ZOO_LOG4J_PROP=WARN
    networks:
      - als-mojaloop-net
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka_2.12-2.3.0/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "kafka:29092",
        ]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 30s

  mysql-als:
    image: mysql/mysql-server
    container_name: als_mysql
    ports:
      - "3306:3306"
    volumes:
      - ./docker/sql-init/:/docker-entrypoint-initdb.d/
    environment:
      - MYSQL_USER=${DBUSER:-account_lookup}
      - MYSQL_PASSWORD=${DBPASS:-password}
      - MYSQL_DATABASE=${DBUSER:-account_lookup}
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    networks:
      - als-mojaloop-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql-als"]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 30s

  mysql-cl:
    image: mysql/mysql-server
    container_name: als_mysql_central_ledger
    ports:
      - "3307:3306"
    volumes:
      - ./docker/sql-init-central-ledger/:/docker-entrypoint-initdb.d/
    environment:
      - MYSQL_USER=${DBUSER:-central_ledger}
      - MYSQL_PASSWORD=${DBPASS:-password}
      - MYSQL_DATABASE=${DBUSER:-central_ledger}
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    networks:
      - als-mojaloop-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql-cl"]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 30s

  redis-node-0:
    <<: *REDIS_NODE
    environment:
      <<: *REDIS_ENVS
      REDIS_CLUSTER_CREATOR: "yes"
    ports:
      - "16379:6379"

  redis-node-1:
    <<: *REDIS_NODE
    environment:
      <<: *REDIS_ENVS
    ports:
      - "16380:6379"

  redis-node-2:
    <<: *REDIS_NODE
    environment:
      <<: *REDIS_ENVS
    ports:
      - "16381:6379"

  redis-node-3:
    <<: *REDIS_NODE
    environment:
      <<: *REDIS_ENVS
    ports:
      - "16382:6379"

  redis-node-4:
    <<: *REDIS_NODE
    environment:
      <<: *REDIS_ENVS
    ports:
      - "16383:6379"

  redis-node-5:
    <<: *REDIS_NODE
    environment:
      <<: *REDIS_ENVS
    ports:
      - "16384:6379"
